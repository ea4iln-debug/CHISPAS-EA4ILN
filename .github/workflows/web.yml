#
# Web de instalacion por USB (web/, ESP Web Tools) en GitHub Pages, con el firmware de la ultima release final y,
# si hay una posterior, de la ultima beta (selector Estable / Beta en la pagina).
# GitHub no sirve los .bin de las releases a otra web (CORS): se copian aqui, partidos en trozos por
# web/preparar.py para no pisar la NVS. Se rehace al publicar una release (final o beta), al cambiar web/ y a mano.

name: Web de instalacion

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml", "docs/*.pdf", "docs/img/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Firmware de la ultima release final y de la ultima beta (si es posterior)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ETIQUETA=$(gh release view --json tagName -q .tagName)  # Sin argumento: la ultima no beta
          VER=${ETIQUETA#v}
          gh release download "$ETIQUETA" -p "chispas-$VER-usb.bin" -D descarga
          ARGS=("descarga/chispas-$VER-usb.bin" "$VER")
          # Beta: la prerelease publicada mas reciente, solo si salio despues de la final (si no, ya esta superada)
          FECHA_FINAL=$(gh release view "$ETIQUETA" --json publishedAt -q .publishedAt)
          BETA=$(gh release list --limit 30 --json tagName,isPrerelease,isDraft,publishedAt \
            -q "[.[] | select(.isPrerelease and (.isDraft | not) and .publishedAt > \"$FECHA_FINAL\")]
                | sort_by(.publishedAt) | last | .tagName // empty")
          if [ -n "$BETA" ]; then
            VERB=${BETA#v}
            gh release download "$BETA" -p "chispas-$VERB-usb.bin" -D descarga
            ARGS+=("descarga/chispas-$VERB-usb.bin" "$VERB")
          fi
          python3 web/preparar.py _site "${ARGS[@]}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: desplegar
        uses: actions/deploy-pages@v4
