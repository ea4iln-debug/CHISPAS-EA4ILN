; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = heltec_wifi_lora_32_V3  ; "pio run" solo compila el firmware

[env:heltec_wifi_lora_32_V3]
platform = espressif32 @ 6.13.0
board = heltec_wifi_lora_32_V3
framework = arduino

monitor_speed = 115200

; Portal WiFiManager en castellano (include/wm_strings_chispas.h). "-I include" para que lo
; encuentre tambien la libreria, que por defecto no busca en el include/ del proyecto
build_flags =
    -I include
    -DWM_STRINGS_FILE="\"wm_strings_chispas.h\""

lib_deps =
    jgromes/RadioLib @ ^6.6.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.2.1

; Mismo firmware para placas sin encoder: el PRG hace de encoder (corta = mover, larga = ejecutar,
; muy larga = dormir). pio run -e heltec_sin_encoder -t upload
[env:heltec_sin_encoder]
extends = env:heltec_wifi_lora_32_V3
build_flags =
    ${env:heltec_wifi_lora_32_V3.build_flags}
    -DSIN_ENCODER

; Programa de prueba de pines del prototipo (encoder): pio run -e prueba_pines -t upload
; Usa pruebas/prueba_pines.cpp en lugar de src/main.cpp
[env:prueba_pines]
platform = espressif32 @ 6.13.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../pruebas/prueba_pines.cpp>

; Prueba de la lectura de bateria con USB (con y sin bateria): pio run -e prueba_bateria -t upload
[env:prueba_bateria]
platform = espressif32 @ 6.13.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../pruebas/prueba_bateria.cpp>

; Prueba del GPS (NMEA y dormirlo por UBX): pio run -e prueba_gps -t upload
[env:prueba_gps]
platform = espressif32 @ 6.13.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../pruebas/prueba_gps.cpp>
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9